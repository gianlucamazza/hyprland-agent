name: Feature request
description: Propose a new feature or enhancement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work? Sketch the UX (CLI flags, config keys, etc.).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - brain / LLM provider
        - daemon / orchestrator
        - CLI
        - TUI
        - safety (allowlist / killswitch)
        - learning / self-improvement
        - memory / episodic
        - integrations
        - packaging / install
        - documentation
        - other
    validations:
      required: true
