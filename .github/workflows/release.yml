name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Build wheel and sdist
        run: uv build
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: false
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.

            ## Install

            **From wheel (this release):**
            ```bash
            pip install https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.VERSION }}/hyprland_agent-${{ steps.version.outputs.VERSION }}-py3-none-any.whl
            ```

            **AUR (Arch Linux):**
            ```bash
            yay -S hyprland-agent
            ```

            **From source:**
            ```bash
            git clone https://github.com/${{ github.repository }}
            cd hyprland-agent && uv sync
            ```
