# config.yaml — hyprland-agent main configuration.
# Copy to ~/.config/hyprland-agent/config.yaml and edit.

brain:
  # Provider to use when --brain is not specified.
  default: auto

  # Priority order for `auto` selection. First credentialed+enabled provider wins.
  auto_order: [claude, openai, moonshot, groq, together, zai, qwen]

  providers:
    claude:
      enabled: true
    openai:
      enabled: true
    moonshot:
      enabled: false
    groq:
      enabled: false
    together:
      enabled: false
    zai:
      enabled: false
    qwen:
      enabled: false

memory:
  # Episodic memory: recalls similar past runs to inject context.
  # First embed call downloads intfloat/multilingual-e5-large (~1.3 GB).
  enabled: true
  recall_k: 3                                     # top-k episodes injected per run
  embedder_model: "intfloat/multilingual-e5-large"
  filter_failure_in_recall: true                  # skip failed past runs in recall

learning:
  enabled: true
  mining_interval_s: 300     # how often to mine rules/skills from runs
  skill_extraction_enabled: true
  rule_mining_enabled: true
  allowlist_mining_enabled: true

integrations:
  # Empty list = load all discovered integrations.
  # List names to restrict: [mako, waybar, fuzzel]
  enabled: []
