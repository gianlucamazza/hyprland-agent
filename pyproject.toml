[project]
name = "hyprland-agent"
version = "1.5.0"
description = "Local-first agentic desktop controller for Hyprland / Wayland"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gianluca Mazza", email = "info@gianlucamazza.it" }]
requires-python = ">=3.13"
keywords = [
  "hyprland",
  "wayland",
  "agent",
  "llm",
  "automation",
  "desktop",
  "computer-use",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.50,<1.0",
  "openai>=2.0,<3.0",
  "pillow>=12.2.0",
  "pydantic>=2.13.4,<3",
  "pyyaml>=6.0.3",
  "textual>=0.85.0,<9",
  "typer>=0.25.1,<1",
  "fastembed>=0.4",
  "sqlite-vec>=0.1.6,<0.2",
  "jeepney>=0.8",
  "rich>=15,<16",
]

[project.urls]
Homepage = "https://github.com/gianlucamazza/hyprland-agent"
Repository = "https://github.com/gianlucamazza/hyprland-agent"
Issues = "https://github.com/gianlucamazza/hyprland-agent/issues"
Changelog = "https://github.com/gianlucamazza/hyprland-agent/blob/main/CHANGELOG.md"

[project.scripts]
agent = "agent.cli:app"
agent-voice = "agent.cli.voice_sidecar:main"
agent-waybar = "agent.cli.waybar_module:main"
fuzzel-agent = "agent.cli.fuzzel_launcher:main"

[project.optional-dependencies]
voice = [
  "sounddevice>=0.4,<1",
  "faster-whisper>=1.1,<2",
  "silero-vad>=5.1,<6",
]

[project.entry-points."hyprland_agent.integrations"]
mako = "agent.integrations.mako:MakoIntegration"
waybar = "agent.integrations.waybar:WaybarIntegration"
fuzzel = "agent.integrations.fuzzel:FuzzelIntegration"
idle = "agent.integrations.idle:IdleIntegration"
voice = "agent.integrations.voice:VoiceIntegration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.hatch.build.targets.sdist]
exclude = [
  ".claude/",
  "CLAUDE.md",
  "AGENTS.md",
  ".python-version",
  "snapshot_report.html",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24",
  "pytest-textual-snapshot>=0.4.0",
  "pytest-cov>=5.0",
  "pip-audit>=2.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["slow: tests that download external models or hit the network"]

[tool.coverage.run]
source = ["src/agent"]
branch = true
omit = ["src/agent/tui/widgets/*"]

[tool.coverage.report]
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
