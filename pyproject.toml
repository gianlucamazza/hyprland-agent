[project]
name = "hyprland-agent"
version = "1.0.0"
description = "Local-first agentic desktop controller for Hyprland / Wayland"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Gianluca", email = "homen3@gmail.com" }]
requires-python = ">=3.13"
keywords = [
  "hyprland",
  "wayland",
  "agent",
  "llm",
  "automation",
  "desktop",
  "computer-use",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: X11 Applications",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Desktop Environment",
  "Topic :: Utilities",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anthropic>=0.101.0,<1.0",
  "openai>=2.36.0,<3.0",
  "pillow>=12.2.0",
  "pydantic>=2.13.4",
  "pyyaml>=6.0.3",
  "textual>=0.85.0",
  "typer>=0.25.1",
  "fastembed>=0.4",
  "sqlite-vec>=0.1.6,<0.2",
  "jeepney>=0.8",
]

[project.urls]
Homepage = "https://github.com/gianlucamazza/hyprland-agent"
Repository = "https://github.com/gianlucamazza/hyprland-agent"
Issues = "https://github.com/gianlucamazza/hyprland-agent/issues"
Changelog = "https://github.com/gianlucamazza/hyprland-agent/blob/main/CHANGELOG.md"

[project.scripts]
agent = "agent.cli:app"
agent-waybar = "agent.cli.waybar_module:main"
fuzzel-agent = "agent.cli.fuzzel_launcher:main"

[project.entry-points."hyprland_agent.integrations"]
mako = "agent.integrations.mako:MakoIntegration"
waybar = "agent.integrations.waybar:WaybarIntegration"
fuzzel = "agent.integrations.fuzzel:FuzzelIntegration"
idle = "agent.integrations.idle:IdleIntegration"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.uv]
package = true

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24",
  "pytest-textual-snapshot>=0.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
